          # No special 'arch' needed here

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements-apple.txt ]; then pip install -r requirements-apple.txt; fi
  
      - name: Get TUI VersionName
        run: | 
          VERSION_NAME=$(python3 -c "import TUI.Version; print(TUI.Version.VersionName)")
          echo "TUI_VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Build with PyInstaller
        run: |
          pyinstaller --collect-all RO --collect-all TUI --collect-all Pmw \
            --collect-all PIL --collect-all twisted --collect-all astropy \
            --collect-all matplotlib --collect-all numpy --collect-all pygame \
            --collect-all scipy \
            --add-data TUI:TUI --add-data RO:RO \
            --icon TUI.icns --windowed --onefile tui.py
          # Save into a DMG file.
          hdiutil create -size 200m \
            -volname "TUI_${TUI_VERSION_NAME}" -srcfolder "dist/tui.app" \
            -ov -format UDZO "dist/tui-${TUI_VERSION_NAME}-${RUNNER_OS}-${RUNNER_ARCH}.dmg"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: tui-${{ env.TUI_VERSION_NAME }}-${{ runner.os }}-${{ runner.arch }}.dmg
          path: dist/tui-${{ env.TUI_VERSION_NAME }}-${{ runner.os }}-${{ runner.arch }}.dmg
          archive: false
