name: Build TUI for Apple Silicon

on:
  push:
    branches: [ test_githubActions ]
  workflow_dispatch:


jobs:
  build-mac-26-arm64:
    # Use macos-14 (or newer) for Apple Silicon runners
    runs-on: macos-26
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          # No special 'arch' needed here, runs-on provides native arm64

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements-apple.txt ]; then pip install -r requirements-apple.txt; fi
  
      - name: Get TUI VersionName
          run: | VERSION_NAME=$(python3 -c "import TUI.Version; print(TUI.Version.VersionName)")
           echo "TUI_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Build with PyInstaller
        run: |
          echo "TUI $TUI_VERSION+NAME OS $env:RUNNER_OS arch env:RUNNER_ARCH"
